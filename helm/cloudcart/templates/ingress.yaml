apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcart-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          # Route 1: Main Frontend Application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudcart-frontend
                port:
                  number: 80
          # Route 2: Cross-Namespace Link directly to the real SonarQube Service
          - path: /sonar
            pathType: Prefix
            backend:
              service:
                name: sonarqube-sonarqube
                port:
                  number: 9000