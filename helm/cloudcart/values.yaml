replicaCount: 2

image:
  repository: your_dockerhub_username/cloudcart-frontend   # <--- Change this to your exact Docker Hub username!
  tag: latest                                              # <--- Make sure this matches the tag GitHub pushes
  pullPolicy: Always
service:
  type: NodePort
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

config:
  APP_NAME: CloudCart
  ENVIRONMENT: dev
  LOG_LEVEL: info

secret:
  DB_USERNAME: admin
  DB_PASSWORD: password123

# Change 'hpa:' to 'autoscaling:'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
