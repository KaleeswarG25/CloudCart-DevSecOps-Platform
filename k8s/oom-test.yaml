apiVersion: apps/v1
kind: Deployment

metadata:
  name: oom-test
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oom-test

  template:
    metadata:
      labels:
        app: oom-test

    spec:
      containers:
        - name: stress

          image: polinux/stress

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "128Mi"
              cpu: "200m"

          command:
            - stress

          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "256M"
            - "--vm-hang"
            - "1"
